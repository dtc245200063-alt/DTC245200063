services:
  db:
    image: mysql:8.0
    container_name: de3_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wp_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      backend_net:
        aliases:
          - db
          - mysql

  wordpress:
    image: wordpress:php8.2-apache
    container_name: de3_wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_app}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      AUTH_KEY: ${AUTH_KEY}
      SECURE_AUTH_KEY: ${SECURE_AUTH_KEY}
      LOGGED_IN_KEY: ${LOGGED_IN_KEY}
      NONCE_KEY: ${NONCE_KEY}
      AUTH_SALT: ${AUTH_SALT}
      SECURE_AUTH_SALT: ${SECURE_AUTH_SALT}
      LOGGED_IN_SALT: ${LOGGED_IN_SALT}
      NONCE_SALT: ${NONCE_SALT}
      WORDPRESS_CONFIG_EXTRA: |
        // Handle Reverse Proxy HTTPS & Host dynamically
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
        $$proto = (isset($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] === 'on') ? 'https' : 'http';
        $$host = $$_SERVER['HTTP_X_FORWARDED_HOST'] ?? $$_SERVER['HTTP_HOST'] ?? '192.168.102.128';
        define('WP_HOME', $$proto . '://' . $$host);
        define('WP_SITEURL', $$proto . '://' . $$host);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
    networks:
      - frontend_net
      - backend_net

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: de3_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_ABSOLUTE_URI: https://192.168.102.128/phpmyadmin/
      UPLOAD_LIMIT: 64M
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: de3_nginx
    restart: unless-stopped
    depends_on:
      - wordpress
      - phpmyadmin
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      frontend_net:
        aliases:
          - nginx
      monitoring_net:

  wpcli:
    image: wordpress:cli-2.11.0
    container_name: de3_wpcli
    user: "33:33"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_app}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_EDITOR_USER: ${WP_EDITOR_USER}
      WP_EDITOR_PASSWORD: ${WP_EDITOR_PASSWORD}
      WP_EDITOR_EMAIL: ${WP_EDITOR_EMAIL}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/scripts:/scripts:ro
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
    networks:
      - backend_net
    profiles:
      - tools
    entrypoint: ["wp"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: de3_prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      monitoring_net:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:13.2.1
    container_name: de3_grafana
    restart: unless-stopped
    user: "472:472"
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://192.168.102.128/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      frontend_net:
        aliases:
          - grafana
      monitoring_net:

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: de3_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    security_opt:
      - no-new-privileges:true
    networks:
      monitoring_net:
        aliases:
          - cadvisor

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: de3_nginx_exporter
    restart: unless-stopped
    depends_on:
      - nginx
    command:
      - --nginx.scrape-uri=http://nginx:80/nginx_status
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      monitoring_net:
        aliases:
          - nginx-exporter

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: de3_mysqld_exporter
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "exporter:${MYSQL_EXPORTER_PASSWORD}@(db:3306)/"
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      backend_net:
      monitoring_net:
        aliases:
          - mysqld-exporter

  loki:
    image: grafana/loki:2.9.2
    container_name: de3_loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      monitoring_net:
        aliases:
          - loki

  promtail:
    image: grafana/promtail:3.6.8
    container_name: de3_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    networks:
      monitoring_net:
        aliases:
          - promtail

  alert-sink:
    build:
      context: ./alert-sink
    container_name: de3_alert_sink
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - alert_sink_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      monitoring_net:
        aliases:
          - alert-sink

volumes:
  db_data:
    name: de3_db_data
  wp_data:
    name: de3_wp_data
  prometheus_data:
    name: de3_prometheus_data
  grafana_data:
    name: de3_grafana_data
  loki_data:
    name: de3_loki_data
  alert_sink_data:
    name: de3_alert_sink_data

networks:
  frontend_net:
    name: de3_frontend_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

  backend_net:
    name: de3_backend_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.2.0/24

  monitoring_net:
    name: de3_monitoring_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.3.0/24
